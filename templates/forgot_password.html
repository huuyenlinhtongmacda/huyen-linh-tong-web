<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">

</head>
<body>

<div class="box">

    <h1>🔑 Quên mật khẩu</h1>

    <form method="POST">

        <!-- USERNAME -->
        <input
            type="text"
            name="username"
            placeholder="Nhập tên tài khoản"
            required
        >

        <!-- PHONE -->
        <input
            type="text"
            name="phone"
            placeholder="Nhập số điện thoại"
            required
        >

        <button type="submit">
            Lấy mật khẩu
        </button>

    </form>

    <!-- THÔNG BÁO -->
    {% if msg %}
        <div class="msg">
            {{ msg }}
        </div>
    {% endif %}

    <!-- HIỆN PASSWORD -->
    {% if password %}
        <div class="password">
            Mật khẩu của bạn: {{ password }}
        </div>
    {% endif %}

    <a href="/login">
        ← Quay lại đăng nhập
    </a>

</div>

</body>
</html>
