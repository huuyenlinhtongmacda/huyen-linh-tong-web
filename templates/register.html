<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" 
              href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <div class="login-box">
        <h2>Đăng Ký</h2>
        <form action="/register" method="POST">
            <input type="text"
                id="username"
                name="username"
                placeholder="Tên đăng nhập">

            <div class="password-box">
                <input type="password"
                    id="password"
                    name="password"
                    placeholder="Mật khẩu">
                    <span onclick="togglePassword('password')" class="eye">👁</span>
            </div>

            <div class="password-box">
                <input type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Xác nhận mật khẩu">
                    <span onclick="togglePassword('confirm_password')" class="eye">👁</span>
            </div>

            <div class="password-box">
                <input type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Số điện thoại">
                    <span onclick="togglePassword('phone')" class="eye">👁</span>
            </div>

            <button type="submit">
                Đăng ký
            </button>
        </form>

            {% if msg %}
                <p class="msg" style="color: red;">{{ msg }}</p>
            {% endif %}
    </div>
    
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
